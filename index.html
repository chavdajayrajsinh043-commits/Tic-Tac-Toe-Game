<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./style.css">
    <title>Tic Tac Toe Game</title>
</head>
<body>
        <h1>Tic Tac Toe Game</h1>
        <div class="wins_pop">
          <p class="win_msg" hidden></p>
          <button class="pa_btn btn" hidden>Play Again</button>
        </div>
        <div class="game_space">
          <div class="score_card">
              <h2>Score Board</h2>
                <h3>X : <span class="x_score"></span> | O : <span class="o_score"></span></h3>
          </div>
          <div class = "turn_area">
             <h2>Turn of : <span class="turn"></span></h2>
          </div>
           <!-- <div class="messgae">
                 <h3 class="msg"></h3>
           </div>  -->
                <div class="game_area">
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                    <button class="box"></button>
                </div>
           <div class="game_button">
             <button class="new_game_btn btn">New Game</button>
              <button class="rest_game_btn btn">Restart</button>
          </div>
        </div>
        <footer>
          <p>&copy; 2026 ALL RIGHT RESERVED BY JRC Developed By : Jayrajsinh Chavda</p>
        </footer>
       
    <script src="./script.js"></script>
</body>
</html>
